[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-trend-recommender"
version = "0.1.0"
description = "Multi-source music ranking with temporal evaluation and seeded exploration."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
music-trends = "music_trend_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["music_trend_recommender"]
mypy_path = "src"
