name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -q

      - name: Regenerate deterministic evaluation artifact
        run: music-trends evaluate --input data/sample/weeks --k 5 --seeds 20 --output /tmp/summary.json

      - name: Verify deterministic evaluation artifact
        run: diff -u examples/evaluation-summary.json /tmp/summary.json
